<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1312" />
  <title>Student Registration — UniVerse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <div class="universe-ambient" aria-hidden="true"></div>
  <main class="container" style="max-width:500px;">
    <div class="text-center mb-4">
      <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none text-reset">
        <span class="d-inline-flex align-items-center justify-content-center rounded-3" style="width:40px;height:40px;background:linear-gradient(135deg,#6366f1,#06b6d4);color:#fff;font-weight:700;">U</span>
        <span class="fw-bold fs-3 font-display">UniVerse</span>
      </a>
      <p class="text-secondary small mt-2 mb-0">Create your Student Account (+50 Starter XP)</p>
    </div>

    <div class="glass-card p-4">
      <form id="register-form" novalidate>
        <div class="mb-3">
          <label for="reg-name" class="form-label small fw-semibold">Full Name</label>
          <input id="reg-name" name="name" type="text" class="form-control" placeholder="e.g., Priya Kulkarni…" autocomplete="name" required />
        </div>
        <div class="mb-3">
          <label for="reg-email" class="form-label small fw-semibold">Campus Email</label>
          <input id="reg-email" name="email" type="email" class="form-control" placeholder="priya@universe.edu…" autocomplete="email" spellcheck="false" required />
        </div>
        <div class="row g-2 mb-3">
          <div class="col-7">
            <label for="reg-dept" class="form-label small fw-semibold">Department</label>
            <select id="reg-dept" class="form-select">
              <option value="Computer Science">Computer Science</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics & Comm.">Electronics &amp; Comm.</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Data Science">Data Science</option>
            </select>
          </div>
          <div class="col-5">
            <label for="reg-sem" class="form-label small fw-semibold">Semester</label>
            <select id="reg-sem" class="form-select">
              <option value="Sem 1">Sem 1</option>
              <option value="Sem 3">Sem 3</option>
              <option value="Sem 5" selected>Sem 5</option>
              <option value="Sem 7">Sem 7</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label for="reg-password" class="form-label small fw-semibold">Password (min 6 chars)</label>
          <div class="input-group">
            <input id="reg-password" name="password" type="password" class="form-control" placeholder="Create a strong password…" autocomplete="new-password" minlength="6" required />
            <button type="button" id="reg-toggle-pw" class="btn btn-universe-ghost" aria-label="Toggle password visibility">
              <i class="bi bi-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div id="reg-error" class="text-danger small mb-3 d-none" role="alert"></div>
        <button type="submit" id="reg-submit-btn" class="btn-universe w-100">Create Student Account</button>
      </form>
      <p class="text-center small text-secondary mt-3 mb-0">
        Already registered? <a href="login.html" class="text-info text-decoration-none fw-semibold">Sign In</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const pw = document.getElementById('reg-password');
    document.getElementById('reg-toggle-pw').addEventListener('click', (e) => {
      const hidden = pw.type === 'password';
      pw.type = hidden ? 'text' : 'password';
      e.currentTarget.querySelector('i').className = hidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('reg-error');
      const btn = document.getElementById('reg-submit-btn');
      errBox.classList.add('d-none');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const department = document.getElementById('reg-dept').value;
      const semester = document.getElementById('reg-sem').value;
      const password = pw.value;

      if (!name || !email || password.length < 6) {
        errBox.textContent = 'Please provide a valid name, email, and a password of at least 6 characters.';
        errBox.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        const data = await UniVerseAPI.request('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password, department, semester })
        });
        UniVerseAPI.setSession(data.token, data.user);
        UniVerseAPI.showToast('Account created! +50 Starter XP awarded.', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 500);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Create Student Account';
      }
    });
  </script>
</body>
</html>
