<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1312" />
  <title>Campus Pulse — UniVerse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="universe-ambient" aria-hidden="true"></div>

  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar" class="app-topbar"></header>
      <main id="main-content" class="app-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 fw-bold mb-1">Campus Pulse</h1>
            <p class="text-secondary small mb-0">Real-time student feed, project updates, and official announcements.</p>
          </div>
          <div class="d-flex gap-2">
            <label for="pulse-search" class="visually-hidden">Search posts</label>
            <input id="pulse-search" type="search" class="form-control form-control-sm" placeholder="Search feed…" />
            <label for="pulse-cat-filter" class="visually-hidden">Filter by category</label>
            <select id="pulse-cat-filter" class="form-select form-select-sm" style="width:auto;">
              <option value="All">All Categories</option>
              <option value="General">General</option>
              <option value="Projects">Projects</option>
              <option value="Clubs">Clubs</option>
              <option value="Academics">Academics</option>
            </select>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-8">
            <!-- Create Post Card -->
            <form id="create-post-form" class="glass-card p-4 mb-4">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label for="post-content" class="fw-semibold small">Share with your campus</label>
                <select id="post-category" class="form-select form-select-sm" style="width:auto;" aria-label="Post category">
                  <option value="General">General</option>
                  <option value="Projects">Projects</option>
                  <option value="Clubs">Clubs</option>
                  <option value="Academics">Academics</option>
                </select>
              </div>
              <textarea id="post-content" class="form-control mb-3" rows="3" placeholder="What are you building, learning, or organizing today?…" required></textarea>
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div>
                  <label for="post-image" class="btn btn-sm btn-universe-ghost mb-0">
                    <i class="bi bi-image" aria-hidden="true"></i> Attach Image
                  </label>
                  <input id="post-image" type="file" accept="image/*" class="d-none" />
                  <span id="post-image-name" class="small text-secondary ms-2"></span>
                </div>
                <button type="submit" class="btn-universe btn-sm">Publish Post (+10 XP)</button>
              </div>
            </form>

            <div id="posts-feed" class="d-flex flex-column gap-3"></div>
          </div>

          <div class="col-lg-4">
            <section class="glass-card p-4">
              <h2 class="h5 fw-bold mb-3">Campus Announcements</h2>
              <div id="pulse-announcements" class="d-flex flex-column gap-3"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/smart-buddy.js"></script>
  <script>
    let currentUser = null;

    document.getElementById('post-image').addEventListener('change', (e) => {
      document.getElementById('post-image-name').textContent = e.target.files[0]?.name || '';
    });

    async function loadPosts() {
      const q = document.getElementById('pulse-search').value.trim();
      const category = document.getElementById('pulse-cat-filter').value;
      const params = new URLSearchParams({ category, q });
      const { posts } = await UniVerseAPI.request(`/api/community/posts?${params.toString()}`);
      const feed = document.getElementById('posts-feed');

      if (!posts.length) {
        feed.innerHTML = '<div class="glass-card p-5 text-center text-secondary">No posts match your filter yet. Start the conversation!</div>';
        return;
      }

      feed.innerHTML = posts.map((p) => {
        const initials = p.author_name.split(' ').map((n) => n[0]).join('').slice(0, 2).toUpperCase();
        const canDelete = currentUser && (currentUser.id === p.user_id || currentUser.role === 'admin');
        return `
          <article class="glass-card p-4">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="d-flex align-items-center gap-2">
                <div class="avatar-circle" style="background:${UniVerseAPI.escapeHtml(p.avatar_color || '#6366f1')}">${initials}</div>
                <div>
                  <div class="fw-bold small">${UniVerseAPI.escapeHtml(p.author_name)} ${p.is_demo ? '<span class="badge-pill badge-demo ms-1">Demo</span>' : ''}</div>
                  <div class="text-secondary" style="font-size:0.75rem;">${UniVerseAPI.escapeHtml(p.department)} · ${UniVerseAPI.formatDate(p.created_at)}</div>
                </div>
              </div>
              <span class="badge-pill badge-accent">${UniVerseAPI.escapeHtml(p.category)}</span>
            </div>

            <p class="mb-3">${UniVerseAPI.escapeHtml(p.content)}</p>
            ${p.image_url ? `<img src="${UniVerseAPI.escapeHtml(p.image_url)}" alt="Post attachment" class="img-fluid rounded-3 mb-3" width="600" height="340" style="max-height:320px;object-fit:cover;" loading="lazy" />` : ''}

            <div class="d-flex flex-wrap align-items-center gap-2 border-top pt-3" style="border-color:var(--border-subtle) !important;">
              <button type="button" class="btn btn-sm ${p.liked_by_me ? 'btn-universe' : 'btn-universe-ghost'} like-btn" data-id="${p.id}">
                <i class="bi bi-heart-fill" aria-hidden="true"></i> <span class="tabular-nums">${p.likes_count}</span>
              </button>
              <button type="button" class="btn btn-sm btn-universe-ghost report-btn" data-id="${p.id}">
                <i class="bi bi-flag" aria-hidden="true"></i> Report
              </button>
              ${canDelete ? `<button type="button" class="btn btn-sm btn-outline-danger ms-auto delete-post-btn" data-id="${p.id}"><i class="bi bi-trash" aria-hidden="true"></i> Delete</button>` : ''}
            </div>

            <div class="mt-3 pt-2 border-top" style="border-color:var(--border-subtle) !important;">
              <div class="d-flex flex-column gap-2 mb-2">
                ${p.comments.map((c) => `
                  <div class="p-2 rounded-3 small" style="background:var(--bg-elevated);">
                    <strong>${UniVerseAPI.escapeHtml(c.author_name)}:</strong> ${UniVerseAPI.escapeHtml(c.content)}
                  </div>`).join('')}
              </div>
              <form class="d-flex gap-2 comment-form" data-id="${p.id}">
                <label class="visually-hidden" for="comment-${p.id}">Add comment</label>
                <input id="comment-${p.id}" type="text" class="form-control form-control-sm" placeholder="Write a comment…" required />
                <button type="submit" class="btn btn-sm btn-universe-ghost">Reply</button>
              </form>
            </div>
          </article>`;
      }).join('');

      feed.querySelectorAll('.like-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await UniVerseAPI.request(`/api/community/posts/${btn.dataset.id}/like`, { method: 'POST' });
          loadPosts();
        });
      });

      feed.querySelectorAll('.delete-post-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this post permanently?')) return;
          await UniVerseAPI.request(`/api/community/posts/${btn.dataset.id}`, { method: 'DELETE' });
          UniVerseAPI.showToast('Post deleted.', 'info');
          loadPosts();
        });
      });

      feed.querySelectorAll('.report-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const reason = prompt('Reason for reporting this post:');
          if (!reason) return;
          await UniVerseAPI.request('/api/community/reports', {
            method: 'POST',
            body: JSON.stringify({ target_type: 'post', target_id: btn.dataset.id, reason })
          });
          UniVerseAPI.showToast('Report submitted for admin review.', 'success');
        });
      });

      feed.querySelectorAll('.comment-form').forEach((form) => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const input = form.querySelector('input');
          const res = await UniVerseAPI.request(`/api/community/posts/${form.dataset.id}/comments`, {
            method: 'POST',
            body: JSON.stringify({ content: input.value.trim() })
          });
          UniVerseAPI.handleRewardToast(res.reward);
          loadPosts();
        });
      });
    }

    async function loadAnnouncements() {
      const { announcements } = await UniVerseAPI.request('/api/community/announcements');
      document.getElementById('pulse-announcements').innerHTML = announcements.map((a) => `
        <div class="p-3 rounded-3" style="background:var(--bg-elevated);border:1px solid var(--border-subtle);">
          <div class="fw-semibold small mb-1">${UniVerseAPI.escapeHtml(a.title)}</div>
          <p class="small text-secondary mb-1">${UniVerseAPI.escapeHtml(a.content)}</p>
          <div style="font-size:0.74rem;" class="text-muted">${UniVerseAPI.escapeHtml(a.author_name)} · ${UniVerseAPI.formatDate(a.created_at)}</div>
        </div>`).join('');
    }

    document.getElementById('create-post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('category', document.getElementById('post-category').value);
      formData.append('content', document.getElementById('post-content').value.trim());
      const file = document.getElementById('post-image').files[0];
      if (file) formData.append('image', file);

      try {
        const res = await UniVerseAPI.request('/api/community/posts', { method: 'POST', body: formData });
        document.getElementById('post-content').value = '';
        document.getElementById('post-image').value = '';
        document.getElementById('post-image-name').textContent = '';
        UniVerseAPI.showToast('Post published!', 'success');
        UniVerseAPI.handleRewardToast(res.reward);
        loadPosts();
      } catch (err) {
        UniVerseAPI.showToast(err.message, 'error');
      }
    });

    document.getElementById('pulse-search').addEventListener('input', loadPosts);
    document.getElementById('pulse-cat-filter').addEventListener('change', loadPosts);

    (async () => {
      currentUser = await UniVerseApp.initShell({ requireAuth: true });
      if (currentUser) {
        loadPosts();
        loadAnnouncements();
      }
    })();
  </script>
</body>
</html>
