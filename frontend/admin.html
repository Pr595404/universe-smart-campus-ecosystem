<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1312" />
  <title>Admin Dashboard — UniVerse</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/design-system.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="universe-ambient" aria-hidden="true"></div>

  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar" class="app-topbar"></header>
      <main id="main-content" class="app-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <span class="badge-pill badge-demo mb-1">Administrator Control Center</span>
            <h1 class="h3 fw-bold mb-0">UniVerse Analytics &amp; Moderation</h1>
          </div>
          <a href="/events.html" class="btn-universe btn-sm">Manage Events</a>
        </div>

        <!-- KPI Grid -->
        <section id="admin-kpis" class="row g-3 mb-4"></section>

        <div class="row g-4 mb-4">
          <!-- Canvas Chart -->
          <div class="col-lg-7">
            <section class="glass-card p-4 h-100">
              <h2 class="h5 fw-bold mb-3">Platform Activity Distribution</h2>
              <canvas id="admin-chart" height="160" aria-label="Platform analytics chart"></canvas>
            </section>
          </div>

          <!-- Publish Announcement -->
          <div class="col-lg-5">
            <form id="admin-announce-form" class="glass-card p-4 h-100">
              <h2 class="h5 fw-bold mb-3">Publish Campus Announcement</h2>
              <div class="mb-2">
                <label for="ann-title" class="form-label small fw-semibold">Title</label>
                <input id="ann-title" type="text" class="form-control form-control-sm" required />
              </div>
              <div class="mb-2">
                <label for="ann-priority" class="form-label small fw-semibold">Priority</label>
                <select id="ann-priority" class="form-select form-select-sm">
                  <option value="normal">Normal</option>
                  <option value="high">High Priority</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="ann-content" class="form-label small fw-semibold">Message</label>
                <textarea id="ann-content" class="form-control form-control-sm" rows="2" required></textarea>
              </div>
              <button type="submit" class="btn-universe btn-sm w-100">Broadcast Announcement</button>
            </form>
          </div>
        </div>

        <!-- Feedback & Reports Moderation -->
        <div class="row g-4 mb-4">
          <div class="col-lg-6">
            <section class="glass-card p-4">
              <h2 class="h5 fw-bold mb-3">Anonymous Voice Moderation</h2>
              <div id="admin-feedback-list" class="d-flex flex-column gap-2"></div>
            </section>
          </div>
          <div class="col-lg-6">
            <section class="glass-card p-4">
              <h2 class="h5 fw-bold mb-3">Content Reports</h2>
              <div id="admin-reports-list" class="d-flex flex-column gap-2"></div>
            </section>
          </div>
        </div>

        <!-- User Management Table -->
        <section class="glass-card p-4">
          <h2 class="h5 fw-bold mb-3">Registered Users</h2>
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0 small" style="--bs-table-bg:transparent;">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Department</th>
                  <th class="tabular-nums">XP</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="admin-users-tbody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/interactions.js"></script>
  <script src="/js/smart-buddy.js"></script>
  <script>
    function drawAdminChart(stats) {
      const canvas = document.getElementById('admin-chart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.parentElement.clientWidth - 48;
      const h = 190;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.scale(dpr, dpr);

      const bars = [
        { label: 'Students', val: stats.totalStudents, color: '#6366f1' },
        { label: 'Events', val: stats.totalEvents, color: '#06b6d4' },
        { label: 'Registrations', val: stats.eventRegistrations, color: '#10b981' },
        { label: 'Posts', val: stats.totalPosts, color: '#8b5cf6' },
        { label: 'Resources', val: stats.resourceCount, color: '#3b82f6' },
        { label: 'Lost/Found', val: stats.lostFoundCount, color: '#f59e0b' }
      ];
      const maxVal = Math.max(...bars.map((b) => b.val), 5);
      const barW = Math.min(54, (w - 80) / bars.length);
      const gap = (w - barW * bars.length) / (bars.length + 1);

      bars.forEach((b, i) => {
        const bh = Math.max(10, (b.val / maxVal) * (h - 52));
        const x = gap + i * (barW + gap);
        const y = h - 28 - bh;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(x, y, barW, bh, 8);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 11px JetBrains Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(String(b.val), x + barW / 2, y - 6);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px Plus Jakarta Sans, sans-serif';
        ctx.fillText(b.label, x + barW / 2, h - 8);
      });
    }

    async function loadAdmin() {
      const user = await UniVerseApp.initShell({ requireAuth: true, allowedRoles: ['admin'] });
      if (!user) return;

      const data = await UniVerseAPI.request('/api/admin/analytics');
      const s = data.stats;

      const kpis = [
        ['Students', s.totalStudents],
        ['Teachers', s.totalTeachers],
        ['Events', s.totalEvents],
        ['Registrations', s.eventRegistrations],
        ['Pulse Posts', s.totalPosts],
        ['Pending Reports', s.pendingReports],
        ['Lost & Found', s.lostFoundCount],
        ['StudyHub Files', s.resourceCount]
      ];
      document.getElementById('admin-kpis').innerHTML = kpis.map(([label, val]) => `
        <div class="col-6 col-md-3">
          <div class="glass-card p-3">
            <div class="small text-secondary">${label}</div>
            <div class="h3 fw-bold tabular-nums mb-0 mt-1">${UniVerseAPI.formatNumber(val)}</div>
          </div>
        </div>`).join('');

      drawAdminChart(s);

      document.getElementById('admin-feedback-list').innerHTML = data.feedback.map((f) => `
        <div class="p-3 rounded-3" style="background:var(--bg-elevated);border:1px solid var(--border-subtle);">
          <div class="small mb-2">${UniVerseAPI.escapeHtml(f.content)}</div>
          <div class="d-flex justify-content-between align-items-center">
            <span class="badge-pill badge-accent">${UniVerseAPI.escapeHtml(f.category)}</span>
            <select class="form-select form-select-sm fb-status-sel" data-id="${f.id}" style="width:auto;" aria-label="Update feedback status">
              ${['Pending', 'Reviewed', 'Resolved'].map((st) => `<option value="${st}" ${f.status === st ? 'selected' : ''}>${st}</option>`).join('')}
            </select>
          </div>
        </div>`).join('');

      document.querySelectorAll('.fb-status-sel').forEach((sel) => {
        sel.addEventListener('change', async () => {
          await UniVerseAPI.request(`/api/admin/feedback/${sel.dataset.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: sel.value })
          });
          UniVerseAPI.showToast('Feedback status updated.', 'success');
        });
      });

      document.getElementById('admin-reports-list').innerHTML = data.reports.length
        ? data.reports.map((r) => `
          <div class="p-3 rounded-3 d-flex justify-content-between align-items-center gap-2" style="background:var(--bg-elevated);border:1px solid var(--border-subtle);">
            <div class="small">
              <strong>${UniVerseAPI.escapeHtml(r.target_type)} #${r.target_id}</strong> · ${UniVerseAPI.escapeHtml(r.reason)}
              <div class="text-muted" style="font-size:0.74rem;">Reported by ${UniVerseAPI.escapeHtml(r.reporter_name)}</div>
            </div>
            <select class="form-select form-select-sm rep-status-sel" data-id="${r.id}" style="width:auto;" aria-label="Update report status">
              ${['pending', 'resolved', 'dismissed'].map((st) => `<option value="${st}" ${r.status === st ? 'selected' : ''}>${st}</option>`).join('')}
            </select>
          </div>`).join('')
        : '<p class="small text-secondary mb-0">No pending reports.</p>';

      document.querySelectorAll('.rep-status-sel').forEach((sel) => {
        sel.addEventListener('change', async () => {
          await UniVerseAPI.request(`/api/admin/reports/${sel.dataset.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: sel.value })
          });
          UniVerseAPI.showToast('Report updated.', 'success');
        });
      });

      document.getElementById('admin-users-tbody').innerHTML = data.users.map((u) => `
        <tr>
          <td>${UniVerseAPI.escapeHtml(u.name)}</td>
          <td>${UniVerseAPI.escapeHtml(u.email)}</td>
          <td><span class="badge-pill badge-cyan text-uppercase">${UniVerseAPI.escapeHtml(u.role)}</span></td>
          <td>${UniVerseAPI.escapeHtml(u.department)}</td>
          <td class="tabular-nums">${u.xp}</td>
          <td>
            ${u.id !== user.id ? `<button type="button" class="btn btn-sm btn-outline-danger del-user-btn" data-id="${u.id}">Remove</button>` : '<span class="text-muted">Active</span>'}
          </td>
        </tr>`).join('');

      document.querySelectorAll('.del-user-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Remove this user account?')) return;
          await UniVerseAPI.request(`/api/admin/users/${btn.dataset.id}`, { method: 'DELETE' });
          UniVerseAPI.showToast('User removed.', 'info');
          loadAdmin();
        });
      });
    }

    document.getElementById('admin-announce-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await UniVerseAPI.request('/api/admin/announcements', {
        method: 'POST',
        body: JSON.stringify({
          title: document.getElementById('ann-title').value.trim(),
          priority: document.getElementById('ann-priority').value,
          content: document.getElementById('ann-content').value.trim()
        })
      });
      e.target.reset();
      UniVerseAPI.showToast('Announcement broadcasted!', 'success');
    });

    loadAdmin();
  </script>
</body>
</html>
