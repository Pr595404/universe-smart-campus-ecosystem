<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1312" />
  <title>Campus Quest &mdash; UniVerse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />

</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="universe-ambient" aria-hidden="true"></div>

  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar" class="app-topbar"></header>
      <main id="main-content" class="app-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 fw-bold mb-1">Campus Quest</h1>
            <p class="text-secondary small mb-0">Complete campus challenges, earn XP, and celebrate your achievements.</p>
          </div>
          <span class="badge-pill badge-cyan tabular-nums fs-6" id="my-xp-pill">0 XP</span>
        </div>

        <div class="row g-4 mb-4">
          <!-- Quests -->
          <div class="col-lg-6">
            <section class="glass-card p-4 h-100">
              <h2 class="h5 fw-bold mb-3">Active Daily &amp; Weekly Quests</h2>
              <div id="quests-list" class="d-flex flex-column gap-2"></div>
            </section>
          </div>

          <!-- Leaderboard -->
          <div class="col-lg-6">
            <section class="glass-card p-4 h-100">
              <h2 class="h5 fw-bold mb-3">Student XP Leaderboard</h2>
              <div id="leaderboard-list" class="d-flex flex-column gap-2"></div>
            </section>
          </div>
        </div>

        <!-- Badges -->
        <section class="glass-card p-4 mb-4">
          <h2 class="h5 fw-bold mb-3">Achievement Badges</h2>
          <div id="badges-grid" class="row g-3"></div>
        </section>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/smart-buddy.js"></script>
  <script>
    async function loadQuestData() {
      const user = await UniVerseApp.initShell({ requireAuth: true });
      if (!user) return;
      document.getElementById('my-xp-pill').textContent = `${UniVerseAPI.formatNumber(user.xp)} XP`;

      const { quests, badges, leaderboard } = await UniVerseAPI.request('/api/campus/quests');

      document.getElementById('quests-list').innerHTML = quests.map((q) => `
        <div class="p-3 rounded-3 d-flex justify-content-between align-items-center gap-2" style="background:var(--bg-elevated);border:1px solid var(--border-subtle);">
          <div>
            <div class="fw-semibold small">${UniVerseAPI.escapeHtml(q.title)} <span class="badge-pill badge-accent ms-1">${q.frequency}</span></div>
            <div class="text-secondary" style="font-size:0.78rem;">${UniVerseAPI.escapeHtml(q.description)}</div>
          </div>
          <span class="badge-pill ${q.completed ? 'badge-emerald' : 'badge-cyan'} tabular-nums">${q.completed ? 'Completed ✓' : `+${q.xp_reward} XP`}</span>
        </div>`).join('');

      document.getElementById('leaderboard-list').innerHTML = leaderboard.map((u, idx) => `
        <div class="p-2 px-3 rounded-3 d-flex justify-content-between align-items-center" style="background:var(--bg-elevated);border:1px solid var(--border-subtle);">
          <div class="d-flex align-items-center gap-2">
            <span class="fw-bold tabular-nums text-info" style="width:24px;">#${idx + 1}</span>
            <span class="small fw-semibold">${UniVerseAPI.escapeHtml(u.name)}</span>
            <span class="text-secondary" style="font-size:0.75rem;">${UniVerseAPI.escapeHtml(u.department)}</span>
          </div>
          <span class="badge-pill badge-accent tabular-nums">${UniVerseAPI.formatNumber(u.xp)} XP</span>
        </div>`).join('');

      document.getElementById('badges-grid').innerHTML = badges.map((b) => `
        <div class="col-sm-6 col-lg-4">
          <div class="p-3 rounded-3 h-100 ${b.earned ? '' : 'opacity-50'}" style="background:var(--bg-elevated);border:1px solid ${b.earned ? 'var(--accent-cyan)' : 'var(--border-subtle)'};">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <strong class="small">${UniVerseAPI.escapeHtml(b.name)}</strong>
              <span class="badge-pill ${b.earned ? 'badge-emerald' : 'badge-accent'}">${b.earned ? 'Unlocked' : `+${b.xp_reward} XP`}</span>
            </div>
            <div class="text-secondary" style="font-size:0.78rem;">${UniVerseAPI.escapeHtml(b.description)}</div>
          </div>
        </div>`).join('');
    }

    loadQuestData();
  </script>
</body>
</html>
