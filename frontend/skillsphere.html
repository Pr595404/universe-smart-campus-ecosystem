<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1312" />
  <title>SkillSphere — UniVerse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="universe-ambient" aria-hidden="true"></div>

  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar" class="app-topbar"></header>
      <main id="main-content" class="app-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 fw-bold mb-1">SkillSphere</h1>
            <p class="text-secondary small mb-0">Find hackathon teammates with complementary skills and launch project ideas.</p>
          </div>
          <button class="btn-universe btn-sm" data-bs-toggle="modal" data-bs-target="#projectModal">
            <i class="bi bi-lightbulb-fill" aria-hidden="true"></i> Post Project Idea (+20 XP)
          </button>
        </div>

        <div class="row g-4 mb-4">
          <!-- My Skills -->
          <div class="col-lg-5">
            <section class="glass-card p-4 h-100">
              <h2 class="h5 fw-bold mb-3">My Skill Profile</h2>
              <form id="add-skill-form" class="row g-2 mb-3">
                <div class="col-6">
                  <label for="skill-name" class="visually-hidden">Skill name</label>
                  <input id="skill-name" type="text" class="form-control form-control-sm" placeholder="e.g., React, Figma, IoT…" required />
                </div>
                <div class="col-4">
                  <label for="skill-type" class="visually-hidden">Skill type</label>
                  <select id="skill-type" class="form-select form-select-sm">
                    <option value="technical">Technical</option>
                    <option value="non-technical">Non-Tech</option>
                  </select>
                </div>
                <div class="col-2">
                  <button type="submit" class="btn btn-sm btn-universe w-100" aria-label="Add skill">+</button>
                </div>
              </form>
              <div id="my-skills-list" class="d-flex flex-wrap gap-2"></div>
            </section>
          </div>

          <!-- Collaboration Requests -->
          <div class="col-lg-7">
            <section class="glass-card p-4 h-100">
              <h2 class="h5 fw-bold mb-3">Collaboration Requests</h2>
              <div id="collab-requests-list" class="d-flex flex-column gap-2"></div>
            </section>
          </div>
        </div>

        <!-- Teammate Discovery -->
        <section class="mb-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h5 fw-bold mb-0">Recommended Teammates</h2>
            <input id="skill-search" type="search" class="form-control form-control-sm" style="max-width:260px;" placeholder="Search by skill or name…" aria-label="Search students by skill" />
          </div>
          <div id="students-grid" class="row g-4"></div>
        </section>

        <!-- Active Project Ideas -->
        <section>
          <h2 class="h5 fw-bold mb-3">Active Campus Project Ideas</h2>
          <div id="projects-grid" class="row g-4"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Project Idea Modal -->
  <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="project-form" class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5 fw-bold" id="projectModalLabel">Post Project Idea</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body d-flex flex-column gap-3">
          <div>
            <label for="proj-title" class="form-label small fw-semibold">Project Title</label>
            <input id="proj-title" type="text" class="form-control" required />
          </div>
          <div>
            <label for="proj-desc" class="form-label small fw-semibold">Description</label>
            <textarea id="proj-desc" class="form-control" rows="3" required></textarea>
          </div>
          <div>
            <label for="proj-skills" class="form-label small fw-semibold">Needed Skills (comma-separated)</label>
            <input id="proj-skills" type="text" class="form-control" placeholder="Three.js, Node.js, UI/UX…" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn-universe">Publish Idea</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Collab Request Modal -->
  <div class="modal fade" id="collabModal" tabindex="-1" aria-labelledby="collabModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="collab-form" class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5 fw-bold" id="collabModalLabel">Invite Teammate</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body d-flex flex-column gap-3">
          <input type="hidden" id="collab-receiver-id" />
          <div>
            <label for="collab-project" class="form-label small fw-semibold">Project / Hackathon Name</label>
            <input id="collab-project" type="text" class="form-control" placeholder="UniVerse HackNight 2026…" required />
          </div>
          <div>
            <label for="collab-msg" class="form-label small fw-semibold">Message</label>
            <textarea id="collab-msg" class="form-control" rows="3" placeholder="Tell them why their skills fit your team…" required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn-universe">Send Request (+15 XP)</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/smart-buddy.js"></script>
  <script>
    let currentUser = null;

    async function loadSkillSphere() {
      const q = document.getElementById('skill-search').value.trim();
      const data = await UniVerseAPI.request(`/api/campus/skillsphere?q=${encodeURIComponent(q)}`);

      // My skills
      const mySkillsEl = document.getElementById('my-skills-list');
      mySkillsEl.innerHTML = data.mySkills.length
        ? data.mySkills.map((s) => `
          <span class="badge-pill ${s.skill_type === 'technical' ? 'badge-cyan' : 'badge-accent'}">
            ${UniVerseAPI.escapeHtml(s.skill_name)}
            <button type="button" class="btn btn-sm p-0 border-0 bg-transparent text-reset ms-1 del-skill-btn" data-id="${s.id}" aria-label="Remove ${UniVerseAPI.escapeHtml(s.skill_name)}">&times;</button>
          </span>`).join('')
        : '<span class="small text-secondary">Add your skills above to unlock teammate matching!</span>';

      mySkillsEl.querySelectorAll('.del-skill-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await UniVerseAPI.request(`/api/campus/skills/${btn.dataset.id}`, { method: 'DELETE' });
          loadSkillSphere();
        });
      });

      // Collab requests
      const reqEl = document.getElementById('collab-requests-list');
      reqEl.innerHTML = data.requests.length
        ? data.requests.map((r) => {
          const isIncoming = currentUser && r.receiver_id === currentUser.id;
          return `
            <div class="p-3 rounded-3 d-flex flex-wrap justify-content-between align-items-center gap-2" style="background:var(--bg-elevated);border:1px solid var(--border-subtle);">
              <div>
                <div class="fw-semibold small">${UniVerseAPI.escapeHtml(r.project_title)}</div>
                <div class="text-secondary" style="font-size:0.78rem;">${isIncoming ? `From ${UniVerseAPI.escapeHtml(r.sender_name)}` : `To ${UniVerseAPI.escapeHtml(r.receiver_name)}`} · "${UniVerseAPI.escapeHtml(r.message)}"</div>
              </div>
              <div class="d-flex gap-1 align-items-center">
                ${
                  isIncoming && r.status === 'pending'
                    ? `<button class="btn btn-sm btn-success resp-btn" data-id="${r.id}" data-status="accepted">Accept</button>
                       <button class="btn btn-sm btn-outline-danger resp-btn" data-id="${r.id}" data-status="rejected">Decline</button>`
                    : `<span class="badge-pill badge-accent text-capitalize">${UniVerseAPI.escapeHtml(r.status)}</span>`
                }
              </div>
            </div>`;
        }).join('')
        : '<p class="small text-secondary mb-0">No collaboration requests yet.</p>';

      reqEl.querySelectorAll('.resp-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await UniVerseAPI.request(`/api/campus/collaborations/${btn.dataset.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: btn.dataset.status })
          });
          UniVerseAPI.showToast(`Request ${btn.dataset.status}.`, 'success');
          loadSkillSphere();
        });
      });

      // Students grid
      const studentsGrid = document.getElementById('students-grid');
      studentsGrid.innerHTML = data.students
        .filter((st) => !currentUser || st.id !== currentUser.id)
        .map((st) => `
          <div class="col-md-6 col-xl-4">
            <article class="glass-card p-4 h-100 d-flex flex-column tilt-card">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <h3 class="h6 fw-bold mb-0">${UniVerseAPI.escapeHtml(st.name)}</h3>
                  <div class="small text-secondary">${UniVerseAPI.escapeHtml(st.department)} · ${UniVerseAPI.escapeHtml(st.semester)}</div>
                </div>
                <span class="badge-pill badge-emerald tabular-nums">${st.matchScore}% Match</span>
              </div>
              <p class="small text-secondary mb-3">${UniVerseAPI.escapeHtml(st.bio || 'Ready to collaborate on campus projects.')}</p>
              <div class="d-flex flex-wrap gap-1 mb-3 flex-grow-1 align-content-start">
                ${st.skills.map((s) => `<span class="badge-pill ${s.skill_type === 'technical' ? 'badge-cyan' : 'badge-accent'}">${UniVerseAPI.escapeHtml(s.skill_name)}</span>`).join('')}
              </div>
              <div class="d-flex gap-2">
                <button type="button" class="btn-universe btn-sm flex-grow-1 invite-btn" data-id="${st.id}" data-name="${UniVerseAPI.escapeHtml(st.name)}">
                  Connect
                </button>
                ${st.portfolio_url ? `<a href="${UniVerseAPI.escapeHtml(st.portfolio_url)}" target="_blank" rel="noopener" class="btn-universe-ghost btn-sm" aria-label="Portfolio"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></a>` : ''}
              </div>
            </article>
          </div>`).join('');

      studentsGrid.querySelectorAll('.invite-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.getElementById('collab-receiver-id').value = btn.dataset.id;
          document.getElementById('collabModalLabel').textContent = `Invite ${btn.dataset.name}`;
          new bootstrap.Modal(document.getElementById('collabModal')).show();
        });
      });

      // Projects grid
      document.getElementById('projects-grid').innerHTML = data.projects.map((p) => `
        <div class="col-md-6">
          <article class="glass-card p-4 h-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h3 class="h6 fw-bold mb-0">${UniVerseAPI.escapeHtml(p.title)}</h3>
              <span class="badge-pill badge-cyan">${UniVerseAPI.escapeHtml(p.status)}</span>
            </div>
            <p class="small text-secondary mb-2">${UniVerseAPI.escapeHtml(p.description)}</p>
            <div class="small text-info">Needed: ${UniVerseAPI.escapeHtml(p.needed_skills)}</div>
            <div class="small text-muted mt-1">Lead: ${UniVerseAPI.escapeHtml(p.owner_name)} (${UniVerseAPI.escapeHtml(p.owner_department)})</div>
          </article>
        </div>`).join('');
    }

    document.getElementById('add-skill-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await UniVerseAPI.request('/api/campus/skills', {
        method: 'POST',
        body: JSON.stringify({
          skill_name: document.getElementById('skill-name').value.trim(),
          skill_type: document.getElementById('skill-type').value
        })
      });
      document.getElementById('skill-name').value = '';
      loadSkillSphere();
    });

    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await UniVerseAPI.request('/api/campus/projects', {
        method: 'POST',
        body: JSON.stringify({
          title: document.getElementById('proj-title').value,
          description: document.getElementById('proj-desc').value,
          needed_skills: document.getElementById('proj-skills').value
        })
      });
      bootstrap.Modal.getInstance(document.getElementById('projectModal')).hide();
      e.target.reset();
      UniVerseAPI.showToast('Project idea published!', 'success');
      UniVerseAPI.handleRewardToast(res.reward);
      loadSkillSphere();
    });

    document.getElementById('collab-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await UniVerseAPI.request('/api/campus/collaborations', {
          method: 'POST',
          body: JSON.stringify({
            receiver_id: document.getElementById('collab-receiver-id').value,
            project_title: document.getElementById('collab-project').value,
            message: document.getElementById('collab-msg').value
          })
        });
        bootstrap.Modal.getInstance(document.getElementById('collabModal')).hide();
        e.target.reset();
        UniVerseAPI.showToast('Collaboration request sent!', 'success');
        UniVerseAPI.handleRewardToast(res.reward);
        loadSkillSphere();
      } catch (err) {
        UniVerseAPI.showToast(err.message, 'error');
      }
    });

    document.getElementById('skill-search').addEventListener('input', loadSkillSphere);

    (async () => {
      currentUser = await UniVerseApp.initShell({ requireAuth: true });
      if (currentUser) loadSkillSphere();
    })();
  </script>
</body>
</html>
