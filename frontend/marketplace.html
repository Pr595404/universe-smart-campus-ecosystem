<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1312" />
  <title>Student Marketplace — UniVerse</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/design-system.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="universe-ambient" aria-hidden="true"></div>

  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar" class="app-topbar"></header>
      <main id="main-content" class="app-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 fw-bold mb-1">Student Marketplace</h1>
            <p class="text-secondary small mb-0">Buy &amp; sell used textbooks, hardware kits, and campus essentials (peer-to-peer listing, no online payments).</p>
          </div>
          <button class="btn-universe btn-sm" data-bs-toggle="modal" data-bs-target="#marketModal">
            <i class="bi bi-tag-fill" aria-hidden="true"></i> List an Item
          </button>
        </div>

        <div class="glass-card p-3 mb-4 d-flex flex-wrap gap-2">
          <input id="mk-search" type="search" class="form-control form-control-sm" style="max-width:250px;" placeholder="Search books or gear…" aria-label="Search marketplace" />
          <select id="mk-cat" class="form-select form-select-sm" style="width:auto;" aria-label="Filter by category">
            <option value="All">All Categories</option>
            <option value="Books">Books</option>
            <option value="Electronics">Electronics</option>
            <option value="Stationery">Stationery</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div id="market-grid" class="row g-4"></div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="marketModal" tabindex="-1" aria-labelledby="marketModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="market-form" class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5 fw-bold" id="marketModalLabel">Post Second-Hand Item</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body d-flex flex-column gap-3">
          <div>
            <label for="mk-title" class="form-label small fw-semibold">Item Title</label>
            <input id="mk-title" type="text" class="form-control" required />
          </div>
          <div class="row g-2">
            <div class="col-4">
              <label for="mk-price" class="form-label small fw-semibold">Price (₹)</label>
              <input id="mk-price" type="number" class="form-control" min="0" required />
            </div>
            <div class="col-4">
              <label for="mk-form-cat" class="form-label small fw-semibold">Category</label>
              <select id="mk-form-cat" class="form-select">
                <option value="Books">Books</option>
                <option value="Electronics">Electronics</option>
                <option value="Stationery">Stationery</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-4">
              <label for="mk-cond" class="form-label small fw-semibold">Condition</label>
              <select id="mk-cond" class="form-select">
                <option value="Like New">Like New</option>
                <option value="Good">Good</option>
                <option value="Fair">Fair</option>
              </select>
            </div>
          </div>
          <div>
            <label for="mk-desc" class="form-label small fw-semibold">Description</label>
            <textarea id="mk-desc" class="form-control" rows="2" required></textarea>
          </div>
          <div>
            <label for="mk-img" class="form-label small fw-semibold">Photo (optional)</label>
            <input id="mk-img" type="file" accept="image/*" class="form-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn-universe">Publish Listing</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/interactions.js"></script>
  <script src="/js/smart-buddy.js"></script>
  <script>
    let currentUser = null;

    async function loadMarketplace() {
      const q = document.getElementById('mk-search').value.trim();
      const category = document.getElementById('mk-cat').value;
      const params = new URLSearchParams({ q, category });
      const { items } = await UniVerseAPI.request(`/api/campus/marketplace?${params.toString()}`);
      const grid = document.getElementById('market-grid');

      if (!items.length) {
        grid.innerHTML = '<div class="col-12"><div class="glass-card p-5 text-center text-secondary">No marketplace listings found.</div></div>';
        return;
      }

      grid.innerHTML = items.map((item) => {
        const canSold = currentUser && item.status === 'available' && (currentUser.id === item.user_id || currentUser.role === 'admin');
        return `
          <div class="col-md-6 col-xl-4">
            <article class="glass-card p-4 h-100 d-flex flex-column tilt-card">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge-pill badge-cyan">${UniVerseAPI.escapeHtml(item.category)}</span>
                <span class="badge-pill ${item.status === 'sold' ? 'badge-demo' : 'badge-emerald'} text-capitalize">${UniVerseAPI.escapeHtml(item.status)}</span>
              </div>
              ${item.image_url ? `<img src="${UniVerseAPI.escapeHtml(item.image_url)}" alt="${UniVerseAPI.escapeHtml(item.title)}" class="rounded-3 mb-3 w-100" width="400" height="200" style="height:170px;object-fit:cover;" loading="lazy" />` : ''}
              <h2 class="h6 fw-bold mb-1">${UniVerseAPI.escapeHtml(item.title)}</h2>
              <div class="h5 fw-bold text-info tabular-nums mb-2">₹${UniVerseAPI.formatNumber(item.price)} <span class="small text-secondary fw-normal">· ${UniVerseAPI.escapeHtml(item.condition)}</span></div>
              <p class="small text-secondary flex-grow-1">${UniVerseAPI.escapeHtml(item.description)}</p>
              <div class="small text-muted mb-3">Seller: ${UniVerseAPI.escapeHtml(item.seller_name)} (${UniVerseAPI.escapeHtml(item.seller_department)})</div>
              <div class="d-flex gap-2">
                ${currentUser && currentUser.id !== item.user_id && item.status === 'available' ? `<button type="button" class="btn-universe btn-sm flex-grow-1 contact-seller-btn" data-uid="${item.user_id}" data-id="${item.id}">Message Seller</button>` : ''}
                ${canSold ? `<button type="button" class="btn-universe-ghost btn-sm flex-grow-1 sold-btn" data-id="${item.id}">Mark Sold</button>` : ''}
              </div>
            </article>
          </div>`;
      }).join('');

      grid.querySelectorAll('.contact-seller-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const msg = prompt('Send a protected message to the seller:');
          if (!msg) return;
          await UniVerseAPI.request('/api/campus/messages', {
            method: 'POST',
            body: JSON.stringify({ receiver_id: btn.dataset.uid, context_type: 'marketplace', context_id: btn.dataset.id, message: msg })
          });
          UniVerseAPI.showToast('Message delivered to seller!', 'success');
        });
      });

      grid.querySelectorAll('.sold-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await UniVerseAPI.request(`/api/campus/marketplace/${btn.dataset.id}/sold`, { method: 'PATCH' });
          UniVerseAPI.showToast('Marked as sold.', 'info');
          loadMarketplace();
        });
      });
    }

    document.getElementById('market-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('title', document.getElementById('mk-title').value.trim());
      fd.append('price', document.getElementById('mk-price').value);
      fd.append('category', document.getElementById('mk-form-cat').value);
      fd.append('condition', document.getElementById('mk-cond').value);
      fd.append('description', document.getElementById('mk-desc').value.trim());
      const img = document.getElementById('mk-img').files[0];
      if (img) fd.append('image', img);

      await UniVerseAPI.request('/api/campus/marketplace', { method: 'POST', body: fd });
      bootstrap.Modal.getInstance(document.getElementById('marketModal')).hide();
      e.target.reset();
      UniVerseAPI.showToast('Listing published!', 'success');
      loadMarketplace();
    });

    document.getElementById('mk-search').addEventListener('input', loadMarketplace);
    document.getElementById('mk-cat').addEventListener('change', loadMarketplace);

    (async () => {
      currentUser = await UniVerseApp.initShell({ requireAuth: true });
      if (currentUser) loadMarketplace();
    })();
  </script>
</body>
</html>
