<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1312" />
  <title>Sign In — UniVerse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <div class="universe-ambient" aria-hidden="true"></div>
  <main class="container" style="max-width:480px;">
    <div class="text-center mb-4">
      <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none text-reset">
        <span class="d-inline-flex align-items-center justify-content-center rounded-3" style="width:40px;height:40px;background:linear-gradient(135deg,#6366f1,#06b6d4);color:#fff;font-weight:700;">U</span>
        <span class="fw-bold fs-3 font-display">UniVerse</span>
      </a>
      <p class="text-secondary small mt-2 mb-0">Sign in to your Smart Campus Workspace</p>
    </div>

    <div class="glass-card p-4">
      <div class="btn-group w-100 mb-3" role="group" aria-label="Select account role">
        <input type="radio" class="btn-check" name="roleTab" id="role-student" value="student" checked />
        <label class="btn btn-outline-info btn-sm" for="role-student">Student</label>
        <input type="radio" class="btn-check" name="roleTab" id="role-teacher" value="teacher" />
        <label class="btn btn-outline-info btn-sm" for="role-teacher">Teacher</label>
        <input type="radio" class="btn-check" name="roleTab" id="role-admin" value="admin" />
        <label class="btn btn-outline-info btn-sm" for="role-admin">Admin</label>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="login-email" class="form-label small fw-semibold">Campus Email</label>
          <input id="login-email" name="email" type="email" class="form-control" placeholder="student@universe.edu…" autocomplete="email" spellcheck="false" required />
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label small fw-semibold">Password</label>
          <div class="input-group">
            <input id="login-password" name="password" type="password" class="form-control" placeholder="Enter your password…" autocomplete="current-password" required />
            <button type="button" id="toggle-pw-btn" class="btn btn-universe-ghost" aria-label="Toggle password visibility">
              <i class="bi bi-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div id="login-error" class="text-danger small mb-3 d-none" role="alert"></div>
        <button type="submit" id="login-submit-btn" class="btn-universe w-100">Sign In</button>
      </form>

      <hr class="my-4" style="border-color:var(--border-subtle);" />

      <p class="small text-secondary mt-3 mb-0">
        Local demo content is added on first startup. Create your own account to explore it. Teacher and admin demo access can be configured privately in your local <code>.env</code> before the database is created.
        <a href="register.html" class="text-info text-decoration-none fw-semibold">Create an account</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const pwInput = document.getElementById('login-password');
    document.getElementById('toggle-pw-btn').addEventListener('click', (e) => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      e.currentTarget.querySelector('i').className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-submit-btn');
      errBox.classList.add('d-none');

      const email = document.getElementById('login-email').value.trim();
      const password = pwInput.value;
      const role = document.querySelector('input[name="roleTab"]:checked').value;

      if (!email || !password) {
        errBox.textContent = 'Please enter both email and password.';
        errBox.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        const data = await UniVerseAPI.request('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password, role })
        });
        UniVerseAPI.setSession(data.token, data.user);
        UniVerseAPI.showToast(`Welcome back, ${data.user.name}!`, 'success');
        setTimeout(() => {
          window.location.href = data.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
        }, 450);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
