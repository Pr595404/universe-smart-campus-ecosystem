<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1312" />
  <title>Anonymous Voice — UniVerse</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/design-system.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="universe-ambient" aria-hidden="true"></div>

  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar" class="app-topbar"></header>
      <main id="main-content" class="app-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 fw-bold mb-1">Anonymous Voice</h1>
            <p class="text-secondary small mb-0">Submit campus suggestions safely—zero identifying user data is stored or exposed.</p>
          </div>
          <div class="d-flex gap-2">
            <select id="fb-cat-filter" class="form-select form-select-sm" style="width:auto;" aria-label="Filter by category">
              <option value="All">All Categories</option>
              <option value="Facilities">Facilities</option>
              <option value="Cafeteria">Cafeteria</option>
              <option value="IT & Wi-Fi">IT &amp; Wi-Fi</option>
              <option value="Academics">Academics</option>
            </select>
            <select id="fb-status-filter" class="form-select form-select-sm" style="width:auto;" aria-label="Filter by status">
              <option value="All">All Statuses</option>
              <option value="Pending">Pending</option>
              <option value="Reviewed">Reviewed</option>
              <option value="Resolved">Resolved</option>
            </select>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-4">
            <form id="fb-form" class="glass-card p-4">
              <h2 class="h5 fw-bold mb-3">Submit Anonymous Suggestion</h2>
              <div class="mb-3">
                <label for="fb-category" class="form-label small fw-semibold">Category</label>
                <select id="fb-category" class="form-select">
                  <option value="Facilities">Facilities</option>
                  <option value="Cafeteria">Cafeteria</option>
                  <option value="IT & Wi-Fi">IT &amp; Wi-Fi</option>
                  <option value="Academics">Academics</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="fb-content" class="form-label small fw-semibold">Your Suggestion</label>
                <textarea id="fb-content" class="form-control" rows="4" placeholder="Share constructive campus feedback…" required></textarea>
              </div>
              <button type="submit" class="btn-universe w-100">Post Anonymously</button>
            </form>
          </div>

          <div class="col-lg-8">
            <div id="fb-list" class="d-flex flex-column gap-3"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/interactions.js"></script>
  <script src="/js/smart-buddy.js"></script>
  <script>
    async function loadFeedback() {
      const category = document.getElementById('fb-cat-filter').value;
      const status = document.getElementById('fb-status-filter').value;
      const params = new URLSearchParams({ category, status });
      const { feedback } = await UniVerseAPI.request(`/api/campus/feedback?${params.toString()}`);
      const list = document.getElementById('fb-list');

      if (!feedback.length) {
        list.innerHTML = '<div class="glass-card p-5 text-center text-secondary">No suggestions match your filter.</div>';
        return;
      }

      list.innerHTML = feedback.map((f) => {
        const badgeClass = f.status === 'Resolved' ? 'badge-emerald' : f.status === 'Reviewed' ? 'badge-cyan' : 'badge-demo';
        return `
          <article class="glass-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div class="d-flex gap-2">
                <span class="badge-pill badge-accent">${UniVerseAPI.escapeHtml(f.category)}</span>
                <span class="badge-pill ${badgeClass}">${UniVerseAPI.escapeHtml(f.status)}</span>
              </div>
              <span class="small text-muted">${UniVerseAPI.formatDate(f.created_at)}</span>
            </div>
            <p class="mb-3">${UniVerseAPI.escapeHtml(f.content)}</p>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-universe-ghost fb-like-btn" data-id="${f.id}">
                <i class="bi bi-hand-thumbs-up-fill text-info" aria-hidden="true"></i> <span class="tabular-nums">${f.likes}</span>
              </button>
              <button type="button" class="btn btn-sm btn-universe-ghost fb-report-btn" data-id="${f.id}">
                <i class="bi bi-flag" aria-hidden="true"></i> Report
              </button>
            </div>
          </article>`;
      }).join('');

      list.querySelectorAll('.fb-like-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await UniVerseAPI.request(`/api/campus/feedback/${btn.dataset.id}/like`, { method: 'POST' });
          loadFeedback();
        });
      });

      list.querySelectorAll('.fb-report-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const reason = prompt('Reason for reporting this feedback:');
          if (!reason) return;
          await UniVerseAPI.request('/api/community/reports', {
            method: 'POST',
            body: JSON.stringify({ target_type: 'feedback', target_id: btn.dataset.id, reason })
          });
          UniVerseAPI.showToast('Report submitted.', 'success');
        });
      });
    }

    document.getElementById('fb-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await UniVerseAPI.request('/api/campus/feedback', {
        method: 'POST',
        body: JSON.stringify({
          category: document.getElementById('fb-category').value,
          content: document.getElementById('fb-content').value.trim()
        })
      });
      document.getElementById('fb-content').value = '';
      UniVerseAPI.showToast('Anonymous suggestion posted!', 'success');
      loadFeedback();
    });

    document.getElementById('fb-cat-filter').addEventListener('change', loadFeedback);
    document.getElementById('fb-status-filter').addEventListener('change', loadFeedback);

    (async () => {
      const user = await UniVerseApp.initShell({ requireAuth: true });
      if (user) loadFeedback();
    })();
  </script>
</body>
</html>
